name: Build Android APK

on:
  push:
    branches: [main, "fix/orbit-ui-and-deployment", "ui/polished-travel-experience"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package no longer exists in current repositories.
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        env:
          ORBIT_API_URL: ${{ vars.ORBIT_API_URL }}
        run: |
          if [ -n "$ORBIT_API_URL" ]; then
            gradle :app:assembleDebug --no-daemon -PORBIT_API_URL="$ORBIT_API_URL"
          else
            echo "::warning::Repository variable ORBIT_API_URL is unset; this APK will use the Android-emulator-only default URL."
            gradle :app:assembleDebug --no-daemon
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
